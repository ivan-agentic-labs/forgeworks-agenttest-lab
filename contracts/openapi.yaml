      properties:
        kind:
          type: string
          minLength: 1
        filename:
          type: string
          minLength: 1
        size_bytes:
          type: integer
          minimum: 1
        sha256: &id003
          type: string
          pattern: ^[0-9a-f]{64}$
        declared_media_type: &id004
          type: string
    UploadIntent:
