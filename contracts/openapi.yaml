      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable problem type URI; about:blank allowed
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]+$
        request_id:
          type: string
          minLength: 1
      example:
        type: about:blank
        title: Conflict
        status: 409
        detail: Resource version is stale
        code: STALE_VERSION
        request_id: request_example_001
    CreateUploadIntentRequest:
