          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        dataset_id:
          type: string
          format: uuid
        version_number:
          type: integer
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        case_count:
          type: integer
          minimum: 1
          maximum: 1000
    AgentBuild:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - name
      - build_sha256
      - tool_manifest_sha256
      - prompt_version
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        name:
          type: string
        build_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        tool_manifest_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        prompt_version:
          type: string
    EvalRun:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - dataset_version_id
      - agent_build_id
      - grader_sha256
      - job_id
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        dataset_version_id:
          type: string
          format: uuid
        agent_build_id:
          type: string
          format: uuid
        grader_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        grader_config_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        threshold:
          type: number
          minimum: 0
          maximum: 1
        seed:
          type:
          - integer
          - 'null'
        seed_source:
          type: string
        job_id:
          type: string
          format: uuid
    EvalCase:
      type: object
      additionalProperties: false
      required:
      - id
      - run_id
      - case_key
      - grade_status
      - score
      - grader_sha256
      - trace_digest
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        case_key:
          type: string
        grade_status:
          type: string
        score:
          description: Scores in newly created runs are rounded to four decimal places using ROUND_HALF_EVEN; exact-json-v1 scores remain 0.0 or 1.0. Historical runs are not backfilled and may retain greater precision.
          type:
          - number
          - 'null'
        grader_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        trace_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        error_code:
          type:
          - string
          - 'null'
    RegressionComparison:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - baseline_run_id
      - candidate_run_id
      - paired_case_count
      - missing_case_count
      - delta_score
      - policy_version
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        baseline_run_id:
          type: string
          format: uuid
        candidate_run_id:
          type: string
          format: uuid
        paired_case_count:
          type: integer
        missing_case_count:
          type: integer
        delta_score:
          description: New comparisons normalize paired case scores to four decimal places, use their unrounded mean delta for threshold decisions, and expose the mean delta rounded to four decimal places using ROUND_HALF_EVEN. Historical comparison records are unchanged.
          type: number
        policy_version:
          type: string
        threshold:
          type: number
          minimum: 0
          maximum: 1
        artifact_id:
          type: string
          format: uuid
        binding:
          $ref: '#/components/schemas/ComparisonBinding'
    CIVerdict:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - comparison_id
      - verdict
      - policy_version
      - signed_artifact_sha256
      - signature_algorithm
      - signature
      - signing_key_id
      - signed_payload
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        comparison_id:
          type: string
          format: uuid
        verdict:
          type: string
        policy_version:
          type: string
        signed_artifact_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        artifact_id:
          type: string
          format: uuid
        binding:
          $ref: '#/components/schemas/ComparisonBinding'
        signature_algorithm:
          type: string
        signature:
          type: string
        signing_key_id:
          type: string
        signed_payload:
          type: string
    CreateDatasetRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
    CreateDatasetVersionRequest:
      type: object
      additionalProperties: false
      required:
      - artifact_id
      - sha256
      - case_count
      properties:
        source_jsonl:
          type: string
          maxLength: 1048576
          description: Exact UTF-8 JSONL bytes supplied as text, at most 1 MiB. Each row requires case_key, input, expected; digest/count are verified. Required outside explicitly seeded development/test fixtures. artifact_id does not prove an external object was read.
        artifact_id:
          type: string
          format: uuid
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        case_count:
          type: integer
          minimum: 1
          maximum: 1000
    CreateAgentBuildRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - build_sha256
      - tool_manifest_sha256
      - prompt_version
      properties:
        name:
          type: string
        build_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        tool_manifest_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        prompt_version:
          type: string
    CreateEvalRunRequest:
      type: object
      additionalProperties: false
      required:
      - dataset_version_id
      - agent_build_id
      - grader_sha256
      properties:
        dataset_version_id:
          type: string
          format: uuid
        agent_build_id:
          type: string
          format: uuid
        grader_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        grader_config:
          $ref: '#/components/schemas/GraderConfig'
        threshold:
          type: number
          minimum: 0
          maximum: 1
        seed:
          type: integer
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        case_results:
          x-case-binding: positional-keys-only
          minItems: 0
          description: Unique results for the version's current positional case keys; unknown keys are rejected, missing cases remain partial.
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/CaseResultInput'
    CreateComparisonRequest:
      type: object
      additionalProperties: false
      required:
      - baseline_run_id
      - policy_version
      properties:
        baseline_run_id:
          type: string
          format: uuid
        policy_version:
          type: string
        threshold:
          type: number
          minimum: 0
          maximum: 1
    GraderConfig:
      type: object
      additionalProperties: true
      properties:
        mode:
          type: string
          enum: [external-scores, exact-json-v1]
          default: external-scores
          description: Exact JSON computes grades from verified dataset expected values; external-scores accepts caller grades.
        threshold:
          type: number
          minimum: 0
          maximum: 1
        seed:
          type: integer
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        seed_source:
          type: string
          minLength: 1
    CaseResultInput:
      type: object
      additionalProperties: false
      required:
      - case_key
      properties:
        observed_output:
          description: JSON output for exact-json-v1. Explicit null is an output; omission is missing. Caller status/score are ignored in exact mode.
        case_key:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: string
          enum:
          - PASS
          - FAIL
          - MISSING
          - TIMEOUT
          - INVALID_RESULT
        score:
          description: In external-scores mode, values for newly created runs are persisted rounded to four decimal places using ROUND_HALF_EVEN. Ignored in exact-json-v1 mode.
          type:
          - number
          - 'null'
        trace_jsonl:
          type: string
          maxLength: 1048576
          description: UTF-8 trace with a 1 MiB encoded-byte limit; records must match the result case key.
        trace_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
    ComparisonBinding:
      type: object
      additionalProperties: true
      required:
      - dataset_version_id
      properties:
        dataset_version_id:
          type: string
          format: uuid
        baseline_build_id:
          type: string
          format: uuid
        candidate_build_id:
          type: string
          format: uuid
        baseline_grader_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        candidate_grader_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
