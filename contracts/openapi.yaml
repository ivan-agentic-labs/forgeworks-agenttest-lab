          type: string
          format: date-time
        required_headers:
          type: object
          additionalProperties:
            type: string
    CommitUploadRequest:
      type: object
      additionalProperties: false
      required:
      - sha256
      - size_bytes
      - object_generation
      properties:
        sha256: *id003
        size_bytes:
          type: integer
          minimum: 1
        object_generation:
          type: string
          minLength: 1
    ArtifactRecord:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - kind
      - sha256
      - size_bytes
      - created_at
      properties:
        id: *id001
        status:
          type: string
          enum:
