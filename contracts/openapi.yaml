        object_generation: *id004
    JobStatus:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - state
      - created_at
      - state_version
      - attempt_count
      properties:
        id: *id001
        kind: *id004
        state:
          type: string
          enum:
          - PENDING
          - RUNNING
          - WAITING_APPROVAL
          - SUCCEEDED
          - FAILED_RETRYABLE
          - FAILED_TERMINAL
          - CANCELLED
          - BLOCKED
          - RECONCILIATION_REQUIRED
        created_at: *id005
        state_version:
          type: integer
          minimum: 1
        attempt_count:
          type: integer
          minimum: 0
        last_error_code:
          type:
          - string
          - 'null'
